<svg xmlns="http://www.w3.org/2000/svg" width="860" height="484" viewBox="0 0 860 484" role="img" aria-label="Terminal replay of tfplan-guard on its sample data"><style>text{font:14px ui-monospace,Menlo,Consolas,monospace;fill:#d6deeb}.p{fill:#7fdbca}.c{fill:#ecc48d}.h{fill:#ff6b6b}.m{fill:#f78c6c}.l{fill:#82aaff}.i{fill:#8a96a8}@keyframes t{from{opacity:0}to{opacity:1}}.r{animation:t .01s backwards}.d0{animation-delay:0.40s}.d1{animation-delay:0.75s}.d2{animation-delay:1.10s}.d3{animation-delay:1.45s}.d4{animation-delay:1.80s}.d5{animation-delay:2.15s}.d6{animation-delay:2.50s}.d7{animation-delay:2.85s}.d8{animation-delay:3.20s}.d9{animation-delay:3.55s}.d10{animation-delay:3.90s}.d11{animation-delay:4.25s}.d12{animation-delay:4.60s}.d13{animation-delay:4.95s}.d14{animation-delay:5.30s}.d15{animation-delay:5.65s}</style><rect width="860" height="484" rx="10" fill="#011627"/><rect width="860" height="34" rx="10" fill="#0b2942"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/><text x="430" y="22" text-anchor="middle" class="i">tfplan-guard</text><text x="20" y="64" xml:space="preserve"><tspan class="p">$ </tspan>./tfplan-guard examples/plan.json</text><text class="r d0 " x="20" y="108" xml:space="preserve">11 resource changes, 10 findings</text><text class="r d1 h" x="20" y="130" xml:space="preserve">CRITICAL TF001 aws_db_instance.orders</text><text class="r d2 " x="20" y="152" xml:space="preserve">         aws_db_instance will be replaced (destroyed and recreated): data in it is lost unless it is res</text><text class="r d3 h" x="20" y="174" xml:space="preserve">CRITICAL TF001 aws_s3_bucket.logs</text><text class="r d4 " x="20" y="196" xml:space="preserve">         aws_s3_bucket will be destroyed: data in it is lost unless it is restored from a backup</text><text class="r d5 h" x="20" y="218" xml:space="preserve">HIGH     TF003 aws_iam_policy.admin</text><text class="r d6 " x="20" y="240" xml:space="preserve">         policy allows every action on every resource</text><text class="r d7 h" x="20" y="262" xml:space="preserve">HIGH     TF004 aws_s3_bucket_acl.site</text><text class="r d8 " x="20" y="284" xml:space="preserve">         bucket ACL is public-read</text><text class="r d9 h" x="20" y="306" xml:space="preserve">HIGH     TF004 aws_s3_bucket_public_access_block.site</text><text class="r d10 " x="20" y="328" xml:space="preserve">         public access block disabled: block_public_acls</text><text class="r d11 h" x="20" y="350" xml:space="preserve">HIGH     TF002 aws_security_group.web</text><text class="r d12 " x="20" y="372" xml:space="preserve">         ingress open to the internet on all ports</text><text class="r d13 h" x="20" y="394" xml:space="preserve">HIGH     TF002 aws_security_group_rule.ssh</text><text class="r d14 " x="20" y="416" xml:space="preserve">         ingress open to the internet on SSH (22)</text><text class="r d15 m" x="20" y="438" xml:space="preserve">MEDIUM   TF005 aws_db_instance.orders</text></svg>
